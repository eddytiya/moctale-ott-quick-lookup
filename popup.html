<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moctale &amp; OTT Quick-Lookup</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>Moctale &amp; OTT<br>Quick-Lookup</h1>
    <p class="intro">Highlight a movie or show, then right-click to find where to watch it in India.</p>
    <form>
      <label for="key">TMDB v3 API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false"
        placeholder="Paste your API key" aria-describedby="key-status" disabled>
      <div class="actions">
        <button id="save" type="submit" disabled>Save key</button>
        <button id="remove" type="button" disabled>Remove</button>
      </div>
      <p id="key-status" role="status">Loading settings…</p>
    </form>
    <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer">Get a TMDB API key</a>
    <footer aria-label="Credits">
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">
        <img src="tmdb-logo.svg" width="40" height="40" alt="TMDB">
      </a>
      <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </footer>
  </main>
</body>
</html>
